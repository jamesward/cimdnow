name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid pushes to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Scala Native compiles bundled C (incl. kyo-http's kyo_tls.c, which needs
      # OpenSSL headers) down to a native binary via clang. clang ships on the
      # runner, but we install libssl-dev to provide <openssl/ssl.h> and libssl.
      - name: Install Scala Native toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libssl-dev

      - name: Set up JDK
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          # kyo's macros are compiled for Java 25 (class file v69). The Scala 3
          # compiler loads them during inlining, so the compiler JVM must be 25+.
          java-version: "25"
          cache: sbt

      - name: Set up sbt
        uses: sbt/setup-sbt@v1.5.5

      - name: Compile
        run: sbt compile

      # Links the native executable end-to-end; this is what actually exercises
      # the clang + OpenSSL toolchain, so it's the meaningful CI gate here.
      - name: Link native binary
        run: sbt nativeLink
